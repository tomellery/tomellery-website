<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trail Closed · Tom Ellery</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* GitHub shows this page for any address that doesn't exist, so every path here starts with "/" */
    :root {
      --night: #0e1116;
      --paper: #f2efe6;
      --ink: #0d0d0d;
      --orange: #ff5a1f;
      --muted: rgba(242, 239, 230, .55);
      --display: "Anton", Impact, "Arial Narrow", sans-serif;
      --mono: "JetBrains Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; }
    html { background: var(--night); }
    body {
      font-family: var(--mono); color: var(--paper); min-height: 100vh; overflow-x: hidden;
      background: radial-gradient(ellipse at 50% -10%, #2a3140, var(--night) 65%);
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      padding: 40px 16px;
    }
    .badge {
      width: 46px; height: 46px; display: grid; place-items: center; margin-bottom: 36px;
      background: var(--orange); color: var(--ink); font-family: var(--display); font-size: 21px;
    }

    /* Closure rope with pennants */
    .rope { position: relative; width: min(100%, 520px); height: 46px; }
    .rope::before { content: ""; position: absolute; left: 0; right: 0; top: 8px; height: 3px; background: #c9c3b2; border-radius: 2px; transform: rotate(-1deg); }
    .flags { position: absolute; left: 4%; right: 4%; top: 9px; display: flex; justify-content: space-between; }
    .flags i { width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 26px solid var(--orange); transform-origin: top center; animation: flap 2.4s ease-in-out infinite; }
    .flags i:nth-child(even) { border-top-color: var(--paper); animation-delay: -.6s; }
    @keyframes flap { 50% { transform: rotate(6deg); } }

    .sign {
      margin-top: -6px; background: var(--orange); color: var(--ink); padding: 22px 30px 20px; border-radius: 6px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .5), inset 0 0 0 3px var(--ink), inset 0 0 0 7px var(--orange), inset 0 0 0 8px rgba(13, 13, 13, .5);
      transform: rotate(-2deg);
    }
    .sign small { display: block; font-size: 12px; font-weight: 700; letter-spacing: .3em; }
    .sign h1 { font-family: var(--display); font-weight: 400; font-size: clamp(56px, 17vw, 96px); line-height: .9; margin-top: 6px; }

    p.why { margin-top: 34px; font-size: 14px; line-height: 1.7; color: var(--muted); max-width: 340px; }
    p.why b { color: var(--paper); }
    a.home {
      display: inline-flex; align-items: center; gap: 10px; margin-top: 26px; padding: 14px 22px;
      background: var(--paper); color: var(--ink); text-decoration: none; border-radius: 6px;
      font-family: var(--display); font-size: 22px; letter-spacing: .03em; transition: background .15s, transform .15s;
    }
    a.home:hover, a.home:focus-visible { background: var(--orange); transform: translateY(-2px); outline: none; }
    .code { margin-top: 30px; font-size: 10px; letter-spacing: .3em; color: var(--muted); }

    @media (prefers-reduced-motion: reduce) { .flags i { animation: none; } }
  </style>
</head>
<body>
  <div class="badge" id="avatar" aria-hidden="true">TE</div>

  <div class="rope" aria-hidden="true"><div class="flags"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="sign">
    <small>⛔ RUN CLOSED</small>
    <h1>TRAIL<br>CLOSED</h1>
  </div>

  <p class="why"><b>This run doesn't exist.</b><br>The page you're looking for was moved or never built.</p>
  <a class="home" href="/">HEAD BACK TO THE LODGE →</a>
  <p class="code">ERROR 404 · TOMELLERY.COM</p>

  <script src="/assets/secrets.js?v=2"></script>
</body>
</html>
