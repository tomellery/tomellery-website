<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08130e">
  <title>Checkers · Game Room</title>
  <meta name="description" content="Play checkers against the computer or a friend on Tom Ellery's Game Room.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <script>try { if (localStorage.getItem("te-theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/boards.css?v=3">
<script defer src="/assets/stats.js"></script>
</head>
<body>
  <div class="room">
    <header class="topbar">
      <a href="../">&larr; Game Room</a>
      <span class="title">Checkers</span>
      <button class="btn small" id="new" type="button">New game</button>
    </header>
    <main class="table">
      <div class="seat" id="seat-top"></div>
      <div id="board"></div>
      <div class="seat" id="seat-bottom"></div>
      <p class="status" id="status" aria-live="polite"></p>
      <div class="controls">
        <button class="btn" id="undo" type="button">Undo</button>
        <button class="btn" id="flip" type="button">Flip</button>
        <button class="btn" id="resign" type="button">Resign</button>
      </div>
      <ol class="moves" id="moves"></ol>
    </main>
  </div>
  <script src="engine.js?v=1"></script>
  <script src="../shared/boards.js?v=1"></script>
  <script src="checkers.js?v=1"></script>
</body>
</html>
