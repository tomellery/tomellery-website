<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tom Ellery</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #000; color: #39ff7a; font-family: "Cascadia Code", Consolas, "Courier New", monospace;
    min-height: 100vh; display: grid; place-items: center; overflow: hidden; padding: 16px; text-align: center; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .card { position: relative; background: #000c; border: 1px solid #39ff7a; padding: 28px 32px; border-radius: 6px;
    box-shadow: 0 0 30px #39ff7a55; max-width: 440px; text-shadow: 0 0 8px #39ff7a; }
  h1 { font-size: clamp(22px, 5vw, 32px); letter-spacing: .08em; }
  p { margin-top: 10px; color: #8dffb3; }
  .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 18px; }
  .links a { color: #39ff7a; text-decoration: none; border: 1px solid #39ff7a; padding: 4px 12px; border-radius: 4px; }
  .links a:hover { background: #39ff7a; color: #000; text-shadow: none; }
</style>  <link rel="icon" href="../assets/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
</head>
<body>
  <canvas id="rain"></canvas>
  <main class="card">
    <h1>SYSTEM UPGRADE IN PROGRESS</h1>
    <p>Follow the white rabbit... or just find me here:</p>
    <div class="links">
      <a href="https://www.instagram.com/tom.a.ellery" target="_blank" rel="noopener">Instagram</a>
      <a href="https://www.facebook.com/tom.a.ellery" target="_blank" rel="noopener">Facebook</a>
      <a href="https://x.com/tomaellery" target="_blank" rel="noopener">X</a>
      <a href="https://www.linkedin.com/in/thomas-ellery" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </main>
<script>
  const c = document.getElementById("rain"), ctx = c.getContext("2d");
  const chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789TOMELLERY";
  const size = 16;
  let cols, drops;
  function resize() { c.width = innerWidth; c.height = innerHeight; cols = Math.ceil(c.width / size); drops = Array.from({ length: cols }, () => Math.random() * -50); }
  resize(); addEventListener("resize", resize);
  setInterval(() => {
    ctx.fillStyle = "rgba(0,0,0,0.08)"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = "#39ff7a"; ctx.font = size + "px monospace";
    drops.forEach((y, i) => {
      ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * size, y * size);
      drops[i] = y * size > c.height && Math.random() > 0.975 ? 0 : y + 1;
    });
  }, 50);
</script>
  <script src="../assets/secrets.js?v=2"></script>
</body></html>
