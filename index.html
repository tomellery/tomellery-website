<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tom Ellery</title>
  <meta name="description" content="Tom Ellery · Salt Lake City · Build · Ride · Repeat. Find me on Instagram, Facebook, X, LinkedIn and Venmo.">

  <!-- Share preview (texts, iMessage, DMs, LinkedIn) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tom Ellery">
  <meta property="og:title" content="Tom Ellery">
  <meta property="og:description" content="SLC 📍 Build · Ride · Repeat">
  <meta property="og:url" content="http://tomellery.com/">
  <meta property="og:image" content="http://tomellery.com/assets/share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Tom Ellery season pass: SLC, Build · Ride · Repeat">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Icons -->
  <link rel="icon" href="assets/icon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#111214">

  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; background: #111214; overflow: hidden; overscroll-behavior: none; }

    .viewport { position: fixed; inset: 0; overflow: hidden; }
    .track { display: flex; height: 100%; will-change: transform; transition: transform .45s cubic-bezier(.25, .8, .25, 1); }
    .track.dragging { transition: none; }
    .slide { flex: 0 0 100vw; width: 100vw; height: 100%; position: relative; background: #111214; }
    .slide iframe { display: block; width: 100%; height: 100%; border: 0; }

    /* Dots */
    .dots {
      position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 5;
      display: flex; gap: 6px; padding: 7px 10px; border-radius: 99px;
      background: rgba(10, 10, 10, .55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
    }
    .dots button {
      width: 7px; height: 7px; padding: 0; border: 0; border-radius: 99px; cursor: pointer;
      background: rgba(255, 255, 255, .4); transition: width .3s, background .3s;
    }
    .dots button[aria-current="true"] { width: 20px; background: #ff5a1f; }
    .dots button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) { .track, .dots button { transition: none; } }
  </style>
</head>
<body>
  <main class="viewport" aria-roledescription="carousel" aria-label="Tom Ellery link page designs">
    <div class="track" id="track"></div>
  </main>
  <nav class="dots" id="dots" aria-label="Choose a design"></nav>

  <script>window.TE_CAROUSEL = true;</script>
  <script src="assets/swipe.js?v=3"></script>
  <script>
    const designs = window.TE_ROTATION;
    const track = document.getElementById("track");
    const dotsEl = document.getElementById("dots");

    // Build one slide + one dot per design
    designs.forEach((d, i) => {
      const slide = document.createElement("section");
      slide.className = "slide";
      slide.setAttribute("aria-roledescription", "slide");
      slide.setAttribute("aria-label", `${i + 1} of ${designs.length}: ${d.title}`);
      slide.innerHTML = `<iframe title="${d.title}" data-src="${d.file}"></iframe>`;
      track.appendChild(slide);

      const dot = document.createElement("button");
      dot.type = "button";
      dot.setAttribute("aria-label", `Show ${d.title}`);
      dot.addEventListener("click", () => go(i));
      dotsEl.appendChild(dot);
    });
    const frames = [...track.querySelectorAll("iframe")];
    const dots = [...dotsEl.children];

    function load(i) {
      const f = frames[(i + designs.length) % designs.length];
      if (!f.getAttribute("src")) f.src = f.dataset.src;
    }

    // Start on the design named in the address (e.g. tomellery.com/#monolith), otherwise the first one
    let index = Math.max(0, designs.findIndex(d => "#" + d.id === location.hash));
    if (location.hash) history.replaceState(null, "", location.pathname);

    function place(offsetPx = 0) {
      track.style.transform = `translateX(calc(${-index * 100}vw + ${offsetPx}px))`;
    }
    function go(i) {
      index = (i + designs.length) % designs.length;
      track.classList.remove("dragging");
      place();
      dots.forEach((d, n) => d.setAttribute("aria-current", n === index ? "true" : "false"));
      load(index); load(index + 1); load(index - 1);
    }
    go(index);
    // Load the rest once the first design has had a moment
    setTimeout(() => designs.forEach((_, i) => load(i)), 2500);

    // Gestures reported by the design inside the current slide (see assets/swipe.js)
    addEventListener("message", e => {
      if (e.origin !== location.origin && location.protocol !== "file:") return;
      if (!e.data || e.data.te !== "swipe" || e.source !== frames[index].contentWindow) return;
      const { type } = e.data;
      if (type === "step") go(index + e.data.step);
      if (type === "drag") {
        // Follow the finger; a little resistance past the first/last design
        let dx = e.data.dx;
        if ((index === 0 && dx > 0) || (index === designs.length - 1 && dx < 0)) dx *= .35;
        track.classList.add("dragging");
        place(dx);
      }
      if (type === "release") {
        const { dx, ms } = e.data;
        const flick = ms < 300 && Math.abs(dx) > 25;
        if (Math.abs(dx) > innerWidth * .2 || flick) go(index + (dx < 0 ? 1 : -1));
        else go(index);
      }
    });

    // Arrow keys when the page itself has focus
    addEventListener("keydown", e => {
      if (e.key === "ArrowRight") go(index + 1);
      if (e.key === "ArrowLeft") go(index - 1);
    });
    addEventListener("resize", () => place());
  </script>
</body>
</html>
