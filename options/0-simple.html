<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tom Ellery</title>
  <style>
    :root { --bg: #f6f5f2; --text: #1a1a1a; --muted: #6b6b6b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121212; --text: #f2f2f2; --muted: #9a9a9a; }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: grid; place-items: center;
      padding: 16px; text-align: center;
    }
    .sign { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 26px; font-weight: 600; }
    p { color: var(--muted); margin-top: 10px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <div class="sign" aria-hidden="true">🚧</div>
    <h1>Under construction</h1>
    <p>Something new is on the way. Check back soon.</p>
  </main>
</body>
</html>
