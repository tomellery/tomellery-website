<!doctype html>

  <style>
    :root {
      --bg: #f6f5f2;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --border: #e4e2dd;
      --hover: #1a1a1a;
      --hover-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --card: #1c1c1c;
        --text: #f2f2f2;
        --muted: #9a9a9a;
        --border: #2c2c2c;
        --hover: #f2f2f2;
        --hover-text: #121212;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 64px 16px;
    }
    main { width: 100%; max-width: 480px; text-align: center; }
    .avatar {
      width: 96px; height: 96px; border-radius: 50%;
      background: var(--text); color: var(--bg);
      display: grid; place-items: center;
      font-size: 32px; font-weight: 600;
      margin: 0 auto 16px;
      object-fit: cover;
    }
    h1 { font-size: 24px; font-weight: 600; }
    .bio { color: var(--muted); margin: 8px 0 32px; line-height: 1.5; }
    ul { list-style: none; padding: 0; display: grid; gap: 12px; }
    a.link {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: inherit; text-decoration: none; font-weight: 500;
      transition: background .15s, color .15s, transform .15s;
    }
    a.link:hover, a.link:focus-visible {
      background: var(--hover); color: var(--hover-text);
      transform: translateY(-2px);
    }
    a.link svg { width: 22px; height: 22px; flex-shrink: 0; fill: currentColor; }
    a.link span { flex: 1; text-align: center; margin-right: 34px; }
    footer { margin-top: 40px; color: var(--muted); font-size: 13px; }

    /* Easter egg: tap the TE 5 times, or type "play" */
    .avatar { cursor: default; user-select: none; -webkit-tap-highlight-color: transparent; transition: transform .1s; }
    .avatar.tap { transform: scale(.92); }
    .egg {
      position: fixed; inset: 0; z-index: 10; display: none; place-items: center;
      background: #0b0f0b; color: #39ff7a; text-shadow: 0 0 8px #39ff7a;
      font-family: "Cascadia Code", Consolas, "Courier New", monospace; font-size: 18px;
      text-align: center; white-space: pre; padding: 16px;
    }
    .egg.on { display: grid; }
  </style>
</head>

  <div class="egg" id="egg" role="status"><div id="eggText"></div></div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    // Easter egg: tap the TE 5 times quickly, or type "play", to launch a random game
    const GAMES = ["8-terminal-flapper.html"]; // runner (7) is saved for a different hidden game later
    function launchEgg() {
      const egg = document.getElementById("egg"), text = document.getElementById("eggText");
      if (egg.classList.contains("on")) return;
      egg.classList.add("on");
      const msg = "> secret found.\n> ACCESS GRANTED\n> loading game...";
      let i = 0;
      (function type() {
        if (i < msg.length) { text.textContent += msg[i++]; setTimeout(type, 35); }
        else setTimeout(() => { location.href = GAMES[Math.floor(Math.random() * GAMES.length)]; }, 600);
      })();
    }
    const avatar = document.getElementById("avatar");
    let taps = 0, tapTimer;
    avatar.addEventListener("click", () => {
      avatar.classList.add("tap"); setTimeout(() => avatar.classList.remove("tap"), 100);
      taps++; clearTimeout(tapTimer);
      tapTimer = setTimeout(() => taps = 0, 1500);
      if (taps >= 5) { taps = 0; launchEgg(); }
    });
    let typed = "";
    addEventListener("keydown", e => {
      typed = (typed + e.key.toLowerCase()).slice(-4);
      if (typed === "play") launchEgg();
    });
  </script>
