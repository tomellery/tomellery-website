<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07060f">
  <title>Brick Buster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/arcade.css">
<script defer src="/assets/stats.js"></script>
</head>
<body class="arcade">
  <main class="cabinet slim-controls" style="--ratio: 0.8">
    <header class="marquee">
      <a class="chip" href="../../index.html">&#9664; ARCADE</a>
      <h1 class="neon">BRICK BUSTER</h1>
      <button class="chip" type="button" data-action="mute" data-mute-label>SOUND ON</button>
    </header>

    <div class="screen">
      <canvas id="game" aria-label="Brick Buster game screen"></canvas>
    </div>

    <div class="touch-controls">
      <div class="lr-pad">
        <button class="pad-btn" type="button" data-action="left" aria-label="Left">&#9664;</button>
        <button class="pad-btn" type="button" data-action="right" aria-label="Right">&#9654;</button>
      </div>
      <div class="action-btns">
        <button class="pad-btn round start" type="button" data-action="start">LAUNCH</button>
        <button class="pad-btn round small" type="button" data-action="pause">PAUSE</button>
      </div>
    </div>

    <p class="hint">MOUSE OR ARROWS MOVE &nbsp; SPACE LAUNCH &nbsp; P PAUSE &nbsp; M SOUND</p>
  </main>

  <script src="../../shared/arcade.js?v=17"></script>
  <script src="bricks.js"></script>
</body>
</html>
