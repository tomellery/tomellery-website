<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07060f">
  <title>Block Drop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/arcade.css">
<script defer src="/assets/stats.js"></script>
</head>
<body class="arcade">
  <main class="cabinet" style="--ratio: 0.8">
    <header class="marquee">
      <a class="chip" href="../../index.html">&#9664; ARCADE</a>
      <h1 class="neon">BLOCK DROP</h1>
      <button class="chip" type="button" data-action="mute" data-mute-label>SOUND ON</button>
    </header>

    <div class="screen">
      <canvas id="game" aria-label="Block Drop game screen"></canvas>
    </div>

    <div class="touch-controls">
      <div class="dpad">
        <button class="pad-btn" type="button" data-action="up" aria-label="Rotate">&#8635;</button>
        <button class="pad-btn" type="button" data-action="left" aria-label="Slide left">&#9664;</button>
        <button class="pad-btn" type="button" data-action="right" aria-label="Slide right">&#9654;</button>
        <button class="pad-btn" type="button" data-action="down" aria-label="Soft drop">&#9660;</button>
      </div>
      <div class="action-btns">
        <button class="pad-btn round start" type="button" data-action="start">DROP</button>
        <button class="pad-btn round small" type="button" data-action="pause">PAUSE</button>
      </div>
    </div>

    <p class="hint">&larr; &rarr; SLIDE &nbsp; &uarr; / X ROTATE (Z BACK) &nbsp; &darr; SOFT DROP &nbsp; SPACE DROP &nbsp; P PAUSE &nbsp; M SOUND</p>
  </main>

  <script src="../../shared/arcade.js?v=15"></script>
  <script src="blocks.js"></script>
</body>
</html>
